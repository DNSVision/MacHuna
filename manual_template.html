<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MacHuna User Manual</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 13px; line-height: 1.6; color: #1a1a1a; max-width: 900px; margin: 40px auto; padding: 0 40px; }
h1 { font-size: 26px; color: #1a3a5c; border-bottom: 3px solid #2e6da4; padding-bottom: 8px; margin-top: 0; }
h2 { font-size: 17px; color: #2e6da4; border-bottom: 1px solid #d6e4f0; padding-bottom: 4px; margin-top: 32px; }
h3 { font-size: 13px; color: #1a1a1a; margin-top: 20px; }
table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 12px; }
th { background: #1a3a5c; color: white; padding: 8px 10px; text-align: left; }
td { padding: 6px 10px; border: 1px solid #cccccc; vertical-align: top; }
tr:nth-child(even) td { background: #f2f2f2; }
code { font-family: "Menlo", "Courier New", monospace; font-size: 11px; background: #f0f4f8; padding: 2px 5px; border-radius: 3px; }
pre { font-family: "Menlo", "Courier New", monospace; font-size: 11px; background: #f0f4f8; padding: 12px; border-left: 3px solid #2e6da4; overflow-x: auto; }
blockquote { background: #f0f4f8; border-left: 4px solid #2e6da4; margin: 12px 0; padding: 8px 14px; font-size: 12px; color: #444; }
blockquote p { margin: 0; }
ul, ol { padding-left: 24px; }
li { margin: 4px 0; }
a { color: #2e6da4; }
hr { border: none; border-top: 1px solid #d6e4f0; margin: 32px 0; }
p { margin: 8px 0; }
</style>
</head>
<body>
$body$
</body>
</html>
